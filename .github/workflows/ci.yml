name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo na mesma branch cancela a execução anterior — sem fila de
# builds obsoletos esperando por nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        id: instalar
        run: npm ci

      # As três verificações rodam mesmo que uma falhe — um type-check
      # quebrado não deve esconder um teste quebrado no mesmo push. Mas
      # nenhuma roda se a instalação falhou: só produziria ruído.
      - name: Type-check (strict)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npx tsc -b

      - name: Testes
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run build
